
name: CricZone WebSocket Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket-benchmark:
    name: ${{ matrix.scenario }} / Run ${{ matrix.repetition }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        scenario:
          - connections-100
          - connections-500
          - connections-1000
          - subscriptions
          - broadcast
          - multiroom
          - sustained
          - reconnect
          - invalid
          - cross-instance
        repetition: [1, 2, 3]

    defaults:
      run:
        working-directory: server

    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      WS_BENCH_REDIS_URL: redis://127.0.0.1:6379
      WS_BENCH_PORT: "4005"
      WS_BENCH_SECOND_PORT: "4006"
      WS_BENCH_REPEATS: "3"
      WS_BENCH_SCENARIO: ${{ matrix.scenario }}
      WS_BENCH_RUN: ${{ matrix.repetition }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Socket.IO servers
        run: |
          mkdir -p benchmarks/websocket/websocket-results

          WS_BENCH_PORT=4005 node benchmarks/websocket/websocket-server.js > benchmarks/websocket/websocket-results/server-4005.log 2>&1 &
          echo $! > benchmarks/websocket/websocket-results/server-4005.pid

          WS_BENCH_PORT=4006 node benchmarks/websocket/websocket-server.js > benchmarks/websocket/websocket-results/server-4006.log 2>&1 &
          echo $! > benchmarks/websocket/websocket-results/server-4006.pid

      - name: Wait for both servers
        run: |
          node --input-type=module <<'EOF'
          for (const port of [4005, 4006]) {
            let ready = false;

            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                const response = await fetch(
                  `http://127.0.0.1:${port}/health`
                );

                if (response.ok) {
                  ready = true;
                  break;
                }
              } catch {}

              await new Promise(resolve =>
                setTimeout(resolve, 500)
              );
            }

            if (!ready) {
              throw new Error(
                `Benchmark server ${port} did not start`
              );
            }

            console.log(`Benchmark server ${port} ready`);
          }
          EOF

      - name: Run selected WebSocket benchmark
        run: node benchmarks/websocket/websocket-suite.js

      - name: Print result and server logs
        if: always()
        run: |
          if [ -f benchmarks/websocket/websocket-results/summary.json ]; then
            cat benchmarks/websocket/websocket-results/summary.json
          fi

          tail -n 80 benchmarks/websocket/websocket-results/server-4005.log || true
          tail -n 80 benchmarks/websocket/websocket-results/server-4006.log || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-${{ matrix.scenario }}-run-${{ matrix.repetition }}
          path: server/benchmarks/websocket/websocket-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop servers
        if: always()
        run: |
          for port in 4005 4006; do
            pidfile="benchmarks/websocket/websocket-results/server-$port.pid"

            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done
