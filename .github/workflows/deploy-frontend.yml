
name: Build and Push Frontend to Amazon ECR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - "src/**"
      - "public/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::260688678650:role/CricZone-GitHub-ECR-Role
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: criczone-frontend
          API_BASE_URL: https://cr-5dda4a2d4f4941bab434b9ec8967acf4.ecs.ap-south-1.on.aws
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          docker build \
            --build-arg "VITE_API_BASE_URL=$API_BASE_URL" \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            .

          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

          echo "Published image: $IMAGE:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
