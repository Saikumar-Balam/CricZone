
name: Valkey Resilience Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valkey-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: criczone_test
          POSTGRES_PASSWORD: criczone_test_password
          POSTGRES_DB: criczone_resilience
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criczone_test -d criczone_resilience"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10


    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:56379
      TEST_REDIS_URL: redis://127.0.0.1:56379
      TEST_DATABASE_URL:  postgresql://criczone_test:criczone_test_password@127.0.0.1:5432/criczone_resilience

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply isolated PostgreSQL outbox migration
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          import pg from "pg";

          const db = new pg.Client({
            connectionString: process.env.TEST_DATABASE_URL
          });

          try {
            await db.connect();

            const sql = fs.readFileSync(
              "database/migrations/001_create_cache_invalidation_outbox.sql",
              "utf8"
            );

            await db.query(sql);

            const result = await db.query(
              "SELECT to_regclass('\''public.cache_invalidation_outbox'\'') AS table_name"
            );

            if (!result.rows[0]?.table_name) {
              throw new Error("Outbox migration verification failed");
            }

            console.log("PASS: Outbox migration applied");
          } finally {
            await db.end();
          }
          '

      - name: Verify Valkey connectivity and cache operations
        run: |
          node --input-type=module -e '
          import { createClient } from "redis";
          const client = createClient({ url: process.env.REDIS_URL, socket: { connectTimeout: 3000, reconnectStrategy: retries => retries > 5 ? false : 200 } });
          client.on("error", error => console.error("Valkey error:", error.code));
          const key = "resilience:baseline";
          try {
            await client.connect();
            if (await client.ping() !== "PONG") throw new Error("PING failed");
            await client.set(key, "criczone", { EX: 60 });
            if (await client.get(key) !== "criczone") throw new Error("GET failed");
            await client.del(key);
            if (await client.get(key) !== null) throw new Error("DELETE failed");
            console.log("PASS: PING, SET, GET, DELETE");
          } finally {
            if (client.isReady) await client.del(key);
            if (client.isOpen) client.destroy();
          }
          '

      - name: Run Valkey baseline benchmark
        run: node benchmarks/resilience/valkey/valkey-baseline.js

      - name: Validate benchmark report
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const path = "benchmarks/resilience/valkey/reports/baseline.json";
          if (!fs.existsSync(path)) throw new Error("Report missing");
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          if (report.passed !== true) throw new Error("Benchmark failed");
          for (const name of ["cacheSet", "cacheGet", "liveStateSet", "liveStateGet"]) {
            const m = report.metrics?.[name];
            if (!m || m.count !== 50 || m.failures !== 0 || m.successRatePercent !== 100 || !Number.isFinite(m.p95Ms) || !Number.isFinite(m.p99Ms)) throw new Error(`Invalid metric: ${name}`);
          }
          if (!(report.metrics.throughputOperationsPerSecond > 0)) throw new Error("Invalid throughput");
          console.log("PASS: Report validated");
          console.log(JSON.stringify(report.metrics, null, 2));
          '

      - name: Simulate Valkey outage
        run: node benchmarks/resilience/valkey/valkey-outage.js

      - name: Validate Valkey outage report
        run: |
          node --input-type=module -e '
          import fs from "node:fs";

          const report = JSON.parse(
            fs.readFileSync(
              "benchmarks/resilience/valkey/reports/outage.json",
              "utf8"
            )
          );

          for (const field of [
            "baselineHealthy",
            "containerStopped",
            "disconnectDetected",
            "pingRejected",
            "cacheGetReturnedNull",
            "cacheWarningObserved",
            "containerRestarted",
            "passed"
          ]) {
            if (report[field] !== true) {
              throw new Error(`Outage verification failed: ${field}`);
            }
          }

          if (
            !Number.isFinite(report.detectionLatencyMs) ||
            report.detectionLatencyMs < 0
          ) {
            throw new Error("Invalid outage detection latency");
          }

          console.log("PASS: Valkey outage detected");
          console.log(
            "Detection latency:",
            report.detectionLatencyMs,
            "ms"
          );
          '

      - name: Verify original Redis client recovery
        run: node benchmarks/resilience/valkey/valkey-recovery.js

      - name: Validate Valkey recovery report
        run: |
          node --input-type=module -e '
          import fs from "node:fs";

          const path =
            "benchmarks/resilience/valkey/reports/recovery.json";

          if (!fs.existsSync(path)) {
            throw new Error("Recovery report missing");
          }

          const r = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          for (const field of [
            "baselineHealthy",
            "outageDetected",
            "containerRestarted",
            "sameClientReused",
            "automaticallyReconnected",
            "pingAfterRecovery",
            "setAfterRecovery",
            "getAfterRecovery",
            "passed"
          ]) {
            if (r[field] !== true) {
              throw new Error(`Recovery failed: ${field}`);
            }
          }

          if (
            !Number.isFinite(r.recoveryLatencyMs) ||
            r.readyEvents < 2 ||
            r.reconnectEvents < 1
          ) {
            throw new Error("Invalid reconnection evidence");
          }

          console.log("PASS: Original client reconnected");
          console.log(
            "Recovery latency:",
            r.recoveryLatencyMs,
            "ms"
          );
          '

      - name: Verify PostgreSQL fallback and cache consistency
        run: node benchmarks/resilience/valkey/valkey-consistency.js


      - name: Validate consistency report
        run: |
          node --input-type=module -e '
          import fs from "node:fs";

          const path =
            "benchmarks/resilience/valkey/reports/consistency.json";

          if (!fs.existsSync(path)) {
            throw new Error("Consistency report missing");
          }

          const r = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          const requiredFields = [
            "baselineHealthy",
            "cacheInitiallyPopulated",
            "outageDetected",
            "invalidationPersisted",
            "fallbackReadFromPostgres",
            "cacheWriteSkippedWhilePending",
            "redisReconnected",
            "staleCachePreservedBeforeWorker",
            "pendingReadBypassedCache",
            "workerProcessed",
            "staleCacheRemoved",
            "outboxCompleted",
            "outboxConsistencyPassed",
            "repairSucceeded",
            "passed"
          ];

          for (const field of requiredFields) {
            if (r[field] !== true) {
              throw new Error(
                `Consistency check failed: ${field}`
              );
            }
          }

          if (
            !Number.isInteger(r.repositoryReads) ||
            r.repositoryReads < 1
          ) {
            throw new Error("Invalid PostgreSQL read count");
          }

          if (
            !Number.isInteger(r.cacheSetCalls) ||
            r.cacheSetCalls < 1
          ) {
            throw new Error("Invalid cache SET count");
          }

          if (
            !Array.isArray(r.failures) ||
            r.failures.length !== 0
          ) {
            throw new Error("Consistency benchmark reported failures");
          }

          console.log(
            "PASS: PostgreSQL fallback and automatic cache consistency"
          );

          console.log(
            JSON.stringify({
              repositoryReads: r.repositoryReads,
              cacheSetCalls: r.cacheSetCalls,
              workerProcessed: r.workerProcessed,
              outboxConsistencyPassed: r.outboxConsistencyPassed
            }, null, 2)
          );
          '


      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valkey-resilience-baseline
          path: server/benchmarks/resilience/valkey/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Valkey container status
        if: always()
        run: docker ps -a --filter "ancestor=valkey/valkey:8-alpine"
