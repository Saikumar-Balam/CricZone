
name: PostgreSQL Resilience Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-resilience:
    name: PostgreSQL Failure and Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: criczone_test
          POSTGRES_PASSWORD: criczone_test
          POSTGRES_DB: criczone_resilience

        ports:
          - 55432:5432

        options: >-
          --health-cmd "pg_isready -U criczone_test -d criczone_resilience"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://criczone_test:criczone_test@127.0.0.1:55432/criczone_resilience
      DB_POOL_MAX: 5
      DB_CONNECTION_TIMEOUT_MS: 1000
      DB_IDLE_TIMEOUT_MS: 1000
      DB_STATEMENT_TIMEOUT_MS: 3000

    steps:

      # 1. Repository and Node.js setup

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 2. Verify initial PostgreSQL connectivity

      - name: Verify PostgreSQL connectivity
        run: |
          node --input-type=module -e '
          import PostgresDatabaseClient from "./src/database/postgres/PostgresDatabaseClient.js";
          import PostgresRetryStrategy from "./src/database/postgres/PostgresRetryStrategy.js";

          const database = new PostgresDatabaseClient(
            {
              connectionString: process.env.DATABASE_URL,
              ssl: false,
              max: 5,
              idleTimeoutMillis: 1000,
              connectionTimeoutMillis: 1000,
              statementTimeoutMillis: 3000
            },
            new PostgresRetryStrategy({
              maxRetries: 2,
              baseDelayMs: 200
            })
          );

          try {
            await database.connect();

            const result = await database.query(
              "SELECT 1 AS value"
            );

            if (result.rows[0]?.value !== 1) {
              throw new Error(
                "Unexpected PostgreSQL query result"
              );
            }

            console.log("PostgreSQL connection successful");
            console.log("SELECT 1 verification passed");
          } finally {
            await database.disconnect();
          }
          '

      # 3. Establish baseline data integrity

      - name: Verify PostgreSQL baseline data integrity
        run: node benchmarks/resilience/postgres/postgres-baseline.js

      # 4. Identify isolated PostgreSQL container

      - name: Identify PostgreSQL service container
        id: postgres-container
        run: |
          CONTAINER_ID=$(docker ps -q \
            --filter "ancestor=postgres:16-alpine")

          if [ -z "$CONTAINER_ID" ]; then
            echo "PostgreSQL service container not found"
            exit 1
          fi

          COUNT=$(echo "$CONTAINER_ID" | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one PostgreSQL container"
            exit 1
          fi

          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

          echo "PostgreSQL service container identified"

      # 5. Simulate PostgreSQL outage

      - name: Simulate PostgreSQL outage
        run: |
          CONTAINER_ID="${{ steps.postgres-container.outputs.container_id }}"

          echo "Stopping PostgreSQL service container"

          docker stop --timeout 5 "$CONTAINER_ID"

          STATUS=$(docker inspect \
            --format '{{.State.Running}}' \
            "$CONTAINER_ID")

          if [ "$STATUS" != "false" ]; then
            echo "PostgreSQL is unexpectedly still running"
            exit 1
          fi

          echo "PostgreSQL outage confirmed"

      # 6. Verify application failure detection

      - name: Verify CricZone detects PostgreSQL failure
        run: node benchmarks/resilience/postgres/postgres-failure.js

      # 7. Restart PostgreSQL and record restart timestamp

      - name: Restart PostgreSQL service
        id: restart-postgres
        if: always() && steps.postgres-container.outputs.container_id != ''
        run: |
          CONTAINER_ID="${{ steps.postgres-container.outputs.container_id }}"

          STATUS=$(docker inspect \
            --format '{{.State.Running}}' \
            "$CONTAINER_ID")

          if [ "$STATUS" = "false" ]; then
            echo "Restarting PostgreSQL container"

            RESTART_STARTED_AT_MS=$(date +%s%3N)

            echo "restart_started_at_ms=$RESTART_STARTED_AT_MS" >> "$GITHUB_OUTPUT"

            docker start "$CONTAINER_ID"

            echo "PostgreSQL container restart requested"
            echo "Restart timestamp: $RESTART_STARTED_AT_MS"

          else
            echo "PostgreSQL container is already running"

            echo "PostgreSQL was not stopped before restart verification"
            exit 1
          fi

      # 8. Verify PostgreSQL application recovery
      # Pass restart timestamp for end-to-end timing

      - name: Verify PostgreSQL application recovery
        if: success() && steps.restart-postgres.outcome == 'success'
        env:
          POSTGRES_RESTART_STARTED_AT_MS: ${{ steps.restart-postgres.outputs.restart_started_at_ms }}
        run: node benchmarks/resilience/postgres/postgres-recovery.js

      # 9. Generate PostgreSQL resilience report

      - name: Generate PostgreSQL resilience report
        if: always()
        run: node benchmarks/resilience/postgres/postgres-report.js

      # 10. Upload PostgreSQL resilience report

      - name: Upload PostgreSQL resilience report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-resilience-report
          path: server/benchmarks/resilience/postgres/reports/
          if-no-files-found: error
          retention-days: 30

      # 11. Display final PostgreSQL container status

      - name: Display PostgreSQL container status
        if: always()
        run: |
          echo "Final PostgreSQL container status:"

          docker ps -a \
            --filter "ancestor=postgres:16-alpine"
