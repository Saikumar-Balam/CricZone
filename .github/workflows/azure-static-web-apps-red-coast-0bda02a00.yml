
name: Azure Static Web Apps CI/CD

on:
  workflow_run:
    workflows:
      - "CricZone Frontend CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    name: Build and Deploy Frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Verify tested commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "main has advanced since CI. Skipping stale deployment."
            exit 1
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: https://criczone-api-ftbnbeewc8bvbcfg.centralindia-01.azurewebsites.net
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_COAST_0BDA02A00 }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "dist"
