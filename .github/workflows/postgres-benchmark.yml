
name: PostgreSQL Benchmark
 
on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Number of concurrent query workers"
        required: true
        default: "50"
        type: choice
        options:
          - "10"
          - "25"
          - "50"

      pool_size:
        description: "Maximum PostgreSQL pool connections"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "15"
          - "20"


jobs:
  postgres-benchmark:
    name: Neon PostgreSQL Benchmark
    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    env:
      BENCHMARK_DATABASE_URL: ${{ secrets.BENCHMARK_DATABASE_URL }}
      BENCHMARK_CONCURRENCY: ${{ inputs.concurrency }}
      BENCHMARK_TOTAL_QUERIES: "300"
      BENCHMARK_POOL_SIZE: ${{ inputs.pool_size }}
      BENCHMARK_OUTPUT_FILE: "postgres-benchmark-results.json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify benchmark secret exists
        run: |
          if [ -z "$BENCHMARK_DATABASE_URL" ]; then
            echo "BENCHMARK_DATABASE_URL secret is missing"
            exit 1
          fi

      - name: Run PostgreSQL benchmark
        run: node database/benchmarks/concurrentQueryBenchmark.js

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-benchmark-${{ inputs.concurrency }}-pool-${{ inputs.pool_size }}
          path: server/postgres-benchmark-results.json
          if-no-files-found: warn
          retention-days: 7
