
name: Consolidated Resilience Consistency

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/resilience-consolidated.yml"
      - "server/benchmarks/resilience/consistency/**"
      - "server/benchmarks/resilience/websocket/**"
      - "server/src/messaging/**"
      - "server/src/websocket/**"
      - "server/src/cache/**"
      - "server/src/services/MatchService.js"
      - "server/src/controllers/MatchController.js"
      - "server/src/routes/match.routes.js"
      - "server/src/workers/CacheInvalidationWorker.js"
      - "server/database/migrations/**"

permissions:
  contents: read

jobs:
  consistency:
    name: "Consistency ${{ matrix.phase }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: cache
            phase: "25.7.6.1"
            script: cache-recovery-consistency.js
            report: cache-recovery.json
            pg_port: "55433"
            redis_port: "56381"
            ws_port: "0"
            kafka: false

          - case: kafka
            phase: "25.7.6.2"
            script: kafka-replay-consistency.js
            report: kafka-replay.json
            pg_port: "55434"
            redis_port: "56382"
            ws_port: "0"
            kafka: true

          - case: websocket
            phase: "25.7.6.3"
            script: websocket-resync-consistency.js
            report: websocket-resync.json
            pg_port: "55435"
            redis_port: "56383"
            ws_port: "4007"
            kafka: false

          - case: cross
            phase: "25.7.6.4"
            script: cross-component-consistency.js
            report: cross-component.json
            pg_port: "55436"
            redis_port: "56384"
            ws_port: "4009"
            kafka: true

    defaults:
      run:
        working-directory: server
        shell: bash

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://criczone_test:criczone_test_password@127.0.0.1:${{ matrix.pg_port }}/criczone_resilience
      TEST_REDIS_URL: redis://127.0.0.1:${{ matrix.redis_port }}
      TEST_KAFKA_BROKER: 127.0.0.1:9092
      WS_BENCH_PORT: ${{ matrix.ws_port }}
      WS_BENCH_REDIS_URL: redis://127.0.0.1:${{ matrix.redis_port }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL and Valkey
        run: |
          set -euo pipefail

          docker run -d \
            --name criczone-ci-postgres \
            -p "127.0.0.1:${{ matrix.pg_port }}:5432" \
            -e POSTGRES_USER=criczone_test \
            -e POSTGRES_PASSWORD=criczone_test_password \
            -e POSTGRES_DB=criczone_resilience \
            postgres:16-alpine

          docker run -d \
            --name criczone-ci-valkey \
            -p "127.0.0.1:${{ matrix.redis_port }}:6379" \
            valkey/valkey:8-alpine

      - name: Start Kafka where required
        if: matrix.kafka == true
        run: |
          set -euo pipefail

          docker run -d \
            --name criczone-ci-kafka \
            -p 127.0.0.1:9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.9.1

      - name: Verify infrastructure readiness
        env:
          NEED_KAFKA: ${{ matrix.kafka }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            pg_ready=false
            redis_ready=false
            kafka_ready=false

            if docker exec criczone-ci-postgres \
              pg_isready -U criczone_test \
              -d criczone_resilience >/dev/null 2>&1; then
              pg_ready=true
            fi

            if docker exec criczone-ci-valkey \
              valkey-cli ping | grep -q PONG; then
              redis_ready=true
            fi

            if [[ "$NEED_KAFKA" == "false" ]]; then
              kafka_ready=true
            elif docker exec criczone-ci-kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server 127.0.0.1:9092 \
              >/dev/null 2>&1; then
              kafka_ready=true
            fi

            if [[ "$pg_ready" == true &&
                  "$redis_ready" == true &&
                  "$kafka_ready" == true ]]; then
              echo "All required services ready"
              exit 0
            fi

            sleep 2
          done

          echo "Infrastructure readiness failed"
          exit 1

      - name: Apply outbox migration
        if: matrix.case == 'cache'
        run: |
          set -euo pipefail

          docker exec -i criczone-ci-postgres \
            psql -v ON_ERROR_STOP=1 \
            -U criczone_test \
            -d criczone_resilience \
            < database/migrations/001_create_cache_invalidation_outbox.sql

      - name: Check JavaScript syntax
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          node --check \
            "benchmarks/resilience/consistency/$SCRIPT"

      - name: Run consistency benchmark
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail

          node \
            "benchmarks/resilience/consistency/$SCRIPT"

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-${{ matrix.case }}-${{ github.run_id }}
          path: server/benchmarks/resilience/consistency/reports/${{ matrix.report }}
          if-no-files-found: warn
          retention-days: 30

      - name: Infrastructure diagnostics
        if: failure()
        run: |
          docker logs criczone-ci-postgres || true
          docker logs criczone-ci-valkey || true
          docker logs criczone-ci-kafka || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f criczone-ci-postgres || true
          docker rm -f criczone-ci-valkey || true
          docker rm -f criczone-ci-kafka || true

  summary:
    name: Consolidated Evidence and Summary
    needs: consistency
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download scenario reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: resilience-*-${{ github.run_id }}
          path: server/benchmarks/resilience/consistency/reports
          merge-multiple: true

      - name: Generate consolidated report
        env:
          MATRIX_RESULT: ${{ needs.consistency.result }}
        run: |
          node \
            benchmarks/resilience/consistency/consolidated-report.js

      - name: Publish run summary
        if: always()
        run: |
          if [[ -f benchmarks/resilience/consistency/reports/consolidated.md ]]; then
            cat benchmarks/resilience/consistency/reports/consolidated.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-consolidated-${{ github.run_id }}
          path: |
            server/benchmarks/resilience/consistency/reports/consolidated.json
            server/benchmarks/resilience/consistency/reports/consolidated.md
          if-no-files-found: warn
          retention-days: 30
