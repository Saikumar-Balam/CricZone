
name: Build and deploy CricZone Backend to Azure

on:
  workflow_run:
    workflows:
      - "CricZone Backend CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build if present
        run: npm run build --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Verify tested commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "main has advanced since CI. Skipping stale deployment."
            exit 1
          fi

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./server

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99A77D373E2C496D9BB17FFD4CC314F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F661548E1B9740868B5CE5E15A29A8AF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7EC1143036C444368A0942A72E2187CE }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: criczone-api
          slot-name: Production
          package: ./server
