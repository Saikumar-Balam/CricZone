
name: CricZone Backend CI/CD - AWS ECS

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: criczone-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend CI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
      TEST_KAFKA_BROKERS: ${{ secrets.TEST_KAFKA_BROKERS }}
      TEST_KAFKA_USERNAME: ${{ secrets.TEST_KAFKA_USERNAME }}
      TEST_KAFKA_PASSWORD: ${{ secrets.TEST_KAFKA_PASSWORD }}
      TEST_KAFKA_TOPIC: criczone.test.live-events      
      TEST_KAFKA_CA_PATH: /tmp/kafka-test-ca.pem


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate test environment
        run: |
          set -euo pipefail

          for VAR in \
            TEST_DATABASE_URL \
            TEST_REDIS_URL \
            TEST_KAFKA_BROKERS \
            TEST_KAFKA_USERNAME \
            TEST_KAFKA_PASSWORD; do
            if [ -z "${!VAR:-}" ]; then
              echo "::error::Missing test configuration: $VAR"
              exit 1
            fi
          done

          echo "Test configuration validated."

      - name: Configure Kafka TLS certificate
        env:
          TEST_KAFKA_CA: ${{ secrets.TEST_KAFKA_CA }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$TEST_KAFKA_CA" ]; then
            echo "::error::Missing TEST_KAFKA_CA secret."
            exit 1
          fi

          printf '%s\n' "$TEST_KAFKA_CA" > "$TEST_KAFKA_CA_PATH"

          echo "Kafka certificate configured."

      - name: Verify PostgreSQL connection
        run: |
          node --input-type=module -e '
          import pg from "pg";

          const client = new pg.Client({
            connectionString: process.env.TEST_DATABASE_URL,
            connectionTimeoutMillis: 10000
          });

          try {
            await client.connect();

            const result = await client.query(
              "SELECT 1 AS connected"
            );

            if (result.rows[0].connected !== 1) {
              throw new Error("PostgreSQL connectivity failed");
            }

            console.log("PostgreSQL connection passed");
          } finally {
            await client.end();
          }
          '

      - name: Verify Valkey connection
        run: |
          node --input-type=module -e '
          import { createClient } from "redis";

          const client = createClient({
            url: process.env.TEST_REDIS_URL,
            socket: {
              connectTimeout: 10000,
              reconnectStrategy: false
            }
          });

          client.on("error", () => {});

          try {
            await client.connect();

            if (await client.ping() !== "PONG") {
              throw new Error("Valkey PING failed");
            }

            console.log("Valkey connection passed");
          } finally {
            if (client.isOpen) {
              client.destroy();
            }
          }
          '

      - name: Verify Kafka connection
        run: |
          npx vitest run \
            tests/integration/kafka/kafka.connection.test.js

      - name: Verify Kafka test topic
        run: |
          npx vitest run \
            tests/integration/kafka/kafka.isolation.test.js

      - name: Run complete backend test suite
        run: npm test

      - name: Clean up Kafka certificate
        if: always()
        run: |
          rm -f "$TEST_KAFKA_CA_PATH"

      - name: CI summary
        if: success()
        run: |
          {
            echo "## CricZone Backend CI"
            echo ""
            echo "Status: Passed"
            echo ""
            echo "PostgreSQL: Connected"
            echo ""
            echo "Valkey: Connected"
            echo ""
            echo "Kafka: Connected"
            echo ""
            echo "Backend tests: Passed"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Backend to AWS ECS
    needs: test    
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')


    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      ECS_CLUSTER: default
      ECS_SERVICE: criczone-api
      ECR_REPOSITORY: criczone-backend
      ECS_SERVICE_ARN: arn:aws:ecs:ap-south-1:260688678650:service/default/criczone-api
      HEALTH_URL: https://cr-5dda4a2d4f4941bab434b9ec8967acf4.ecs.ap-south-1.on.aws/health

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::260688678650:role/CricZone-GitHub-ECR-Role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [ "$ACCOUNT" != "260688678650" ]; then
            echo "::error::Unexpected AWS account."
            exit 1
          fi

          echo "AWS account verified."

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or reuse backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            >/dev/null 2>&1; then

            echo "Reusing existing immutable image."

          else
            docker build \
              --tag "$IMAGE" \
              ./server

            docker push "$IMAGE"
          fi

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::ECR image digest missing."
            exit 1
          fi

          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY@$DIGEST"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Docker image ready."

      - name: Register updated task definition
        id: task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          umask 077

          trap 'rm -f task-current.json task-new.json' EXIT

          CURRENT_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" \
            --output text)

          if [ -z "$CURRENT_TASK" ] || [ "$CURRENT_TASK" = "None" ]; then
            echo "::error::Current ECS task not found."
            exit 1
          fi

          echo "Current ECS task: $CURRENT_TASK"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query taskDefinition \
            --output json > task-current.json

          jq -e --arg image "$IMAGE_URI" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage,
              pidMode,
              ipcMode,
              proxyConfiguration
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "Main"
                then .image = $image
                else .
                end
              )
            | if any(.containerDefinitions[]; .name == "Main")
              then .
              else error("Main container not found")
              end
          ' task-current.json > task-new.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "::error::Task registration failed."
            exit 1
          fi

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

          echo "Registered ECS task: $ARN"

      - name: Deploy to ECS Express Mode
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --task-definition-arn "$TASK_DEFINITION_ARN" \
            --no-cli-pager \
            --output json > /dev/null

          echo "ECS deployment requested."

      - name: Wait for ECS deployment completion
        env:
          EXPECTED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].deployments[?taskDefinition=='$EXPECTED_TASK'].rolloutState | [0]" \
              --output text)

            echo "Deployment check $attempt/120: $STATUS"

            if [ "$STATUS" = "COMPLETED" ]; then
              echo "ECS deployment completed."
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "::error::ECS deployment failed."
              exit 1
            fi

            if [ "$STATUS" = "None" ]; then
              echo "::error::Expected ECS deployment not found."
              exit 1
            fi

            sleep 10
          done

          echo "::error::ECS deployment timed out."
          exit 1

      - name: Verify running ECS task
        env:
          EXPECTED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          RUNNING_TASKS=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text)

          if [ -z "$RUNNING_TASKS" ]; then
            echo "::error::No running ECS tasks."
            exit 1
          fi

          TASK_REVISIONS=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks $RUNNING_TASKS \
            --query 'tasks[].taskDefinitionArn' \
            --output text)

          if ! printf '%s\n' "$TASK_REVISIONS" \
            | tr '\t' '\n' \
            | grep -Fxq "$EXPECTED_TASK"; then

            echo "::error::Expected ECS revision not running."
            exit 1
          fi

          echo "Correct ECS revision running."

      - name: Verify production backend health
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            "$HEALTH_URL" > /dev/null

          echo "Production backend health check passed."

      - name: Deployment summary
        if: success()
        env:
          DEPLOYED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          {
            echo "## CricZone Backend CI/CD"
            echo ""
            echo "Status: Successful"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Task: $DEPLOYED_TASK"
            echo ""
            echo "Environment: AWS ECS Production"
            echo ""
            echo "Health: Passed"
          } >> "$GITHUB_STEP_SUMMARY"
