
name: Deploy CricZone Backend to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: criczone-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::260688678650:role/CricZone-GitHub-ECR-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/criczone-backend:$GITHUB_SHA"
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images --repository-name criczone-backend --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          test -n "$DIGEST"
          test "$DIGEST" != "None"
          echo "uri=$REGISTRY/criczone-backend@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Register updated task definition
        id: task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition default-criczone-api:17 --query taskDefinition --output json > task-current.json
          jq --arg image "$IMAGE_URI" '{
            family,
            taskRoleArn,
            executionRoleArn,
            networkMode,
            containerDefinitions,
            volumes,
            placementConstraints,
            requiresCompatibilities,
            cpu,
            memory,
            runtimePlatform,
            ephemeralStorage,
            pidMode,
            ipcMode,
            proxyConfiguration
          } | with_entries(select(.value != null)) | .containerDefinitions |= map(if .name == "Main" then .image = $image else . end)' task-current.json > task-new.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://task-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          rm -f task-current.json task-new.json

      
      - name: Deploy to ECS Express Mode
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-express-gateway-service --service-arn arn:aws:ecs:ap-south-1:260688678650:service/default/criczone-api --task-definition-arn "$TASK_DEFINITION_ARN" --region ap-south-1 --no-cli-pager


      - name: Verify deployed task revision
        env:
          EXPECTED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail
          RUNNING_TASKS=$(aws ecs list-tasks --cluster default --service-name criczone-api --desired-status RUNNING --query 'taskArns' --output text)
          test -n "$RUNNING_TASKS"
          aws ecs describe-tasks --cluster default --tasks $RUNNING_TASKS --query 'tasks[].taskDefinitionArn' --output text | tr '\t' '\n' | grep -Fx "$EXPECTED_TASK"

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 15 https://cr-5dda4a2d4f4941bab434b9ec8967acf4.ecs.ap-south-1.on.aws/health
