
name: CricZone Backend CI/CD - AWS ECS

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: criczone-backend-production
  cancel-in-progress: false

jobs:

  test:
    name: Backend CI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: CI summary
        if: success()
        run: |
          echo "Backend CI checks passed." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Backend to AWS ECS
    needs: test

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ap-south-1
      ECS_CLUSTER: default
      ECS_SERVICE: criczone-api
      ECR_REPOSITORY: criczone-backend
      ECS_SERVICE_ARN: arn:aws:ecs:ap-south-1:260688678650:service/default/criczone-api
      HEALTH_URL: https://cr-5dda4a2d4f4941bab434b9ec8967acf4.ecs.ap-south-1.on.aws/health

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::260688678650:role/CricZone-GitHub-ECR-Role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' \
            --output json

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or reuse backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Checking whether image exists in ECR..."

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            >/dev/null 2>&1; then

            echo "Existing immutable image found."
            echo "Reusing existing image."

          else

            echo "Building backend Docker image..."

            docker build \
              --tag "$IMAGE" \
              ./server

            echo "Pushing image to Amazon ECR..."

            docker push "$IMAGE"

          fi

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::Unable to resolve ECR image digest."
            exit 1
          fi

          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY@$DIGEST"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "ECR image verified successfully."


      - name: Register updated task definition
        id: task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          umask 077

          trap 'rm -f task-current.json task-new.json' EXIT

          echo "Retrieving current ECS task definition..."

          CURRENT_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" \
            --output text)

          if [ -z "$CURRENT_TASK" ] || [ "$CURRENT_TASK" = "None" ]; then
            echo "::error::Cannot find PRIMARY ECS task definition."
            exit 1
          fi

          echo "Current task: $CURRENT_TASK"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query taskDefinition \
            --output json > task-current.json

          jq -e --arg image "$IMAGE_URI" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage,
              pidMode,
              ipcMode,
              proxyConfiguration
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "Main"
                then .image = $image
                else .
                end
              )
            | if any(.containerDefinitions[]; .name == "Main")
              then .
              else error("Main container not found")
              end
          ' task-current.json > task-new.json

          echo "Registering new task definition..."

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "::error::Task definition registration failed."
            exit 1
          fi

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

          echo "Registered task definition: $ARN"

      - name: Deploy to ECS Express Mode
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          echo "Requesting ECS deployment..."

          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --task-definition-arn "$TASK_DEFINITION_ARN" \
            --no-cli-pager \
            --output json > /dev/null

          echo "ECS deployment requested successfully."

      - name: Wait for ECS deployment completion
        env:
          EXPECTED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          echo "Waiting for ECS rolling deployment..."

          for attempt in $(seq 1 120); do

            STATUS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].deployments[?taskDefinition=='$EXPECTED_TASK'].rolloutState | [0]" \
              --output text)

            echo "Deployment check $attempt/120: $STATUS"

            if [ "$STATUS" = "COMPLETED" ]; then
              echo "ECS deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "::error::ECS deployment failed."
              exit 1
            fi

            if [ "$STATUS" = "None" ]; then
              echo "::error::Expected ECS deployment not found."
              exit 1
            fi

            sleep 10

          done

          echo "::error::ECS deployment timed out after 20 minutes."
          exit 1


      - name: Verify running ECS task revision
        env:
          EXPECTED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          RUNNING_TASKS=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text)

          if [ -z "$RUNNING_TASKS" ]; then
            echo "::error::No running ECS tasks."
            exit 1
          fi

          TASK_REVISIONS=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks $RUNNING_TASKS \
            --query 'tasks[].taskDefinitionArn' \
            --output text)

          if ! printf '%s\n' "$TASK_REVISIONS" \
            | tr '\t' '\n' \
            | grep -Fxq "$EXPECTED_TASK"; then

            echo "::error::New task revision is not running."
            exit 1

          fi

          echo "Expected task revision is running."


      - name: Verify backend health
        run: |
          set -euo pipefail

          echo "Checking production backend health..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            "$HEALTH_URL" > /dev/null

          echo "Backend health check passed."

      - name: Deployment summary
        if: success()
        env:
          DEPLOYED_TASK: ${{ steps.task.outputs.arn }}
        run: |
          {
            echo "## CricZone Backend CI/CD"
            echo ""
            echo "Status: Successful"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "ECS task: $DEPLOYED_TASK"
            echo ""
            echo "Environment: AWS Production"
            echo ""
            echo "Backend health: Passed"
          } >> "$GITHUB_STEP_SUMMARY"
