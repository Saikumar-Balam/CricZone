
name: Export PostgreSQL Schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-schema:
    runs-on: ubuntu-24.04

    steps:
      - name: Export PostgreSQL 18 schema
        env:
          DATABASE_URL: ${{ secrets.NEON_SCHEMA_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Database secret is missing"
            exit 1
          fi

          mkdir -p output

          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD/output:/output" \
            -v /etc/ssl/certs:/runner-certs:ro \
            postgres:18 \
            sh -ec '
              export PGSSLROOTCERT=/runner-certs/ca-certificates.crt

              test -s "$PGSSLROOTCERT"

              pg_dump \
                --dbname="$DATABASE_URL" \
                --schema-only \
                --no-owner \
                --no-acl \
                --file=/output/schema.sql
            '

      - name: Upload schema
        uses: actions/upload-artifact@v4
        with:
          name: criczone-postgres-schema
          path: output/schema.sql
          retention-days: 1
          if-no-files-found: error
