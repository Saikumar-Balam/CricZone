
name: Valkey Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: "Valkey benchmark workload"
        required: true
        default: "mixed"
        type: choice
        options:
          - read
          - write
          - commentary
          - invalidation
          - ttl
          - mixed
          - live_ball

      concurrency:
        description: "Number of concurrent workers"
        required: true
        default: "10"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "25"
          - "50"

      total_operations:
        description: "Total benchmark operations"
        required: true
        default: "300"
        type: string

jobs:
  valkey-benchmark:
    name: CricZone Valkey Performance Benchmark
    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read

    services:
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      BENCHMARK_VALKEY_URL: redis://127.0.0.1:6379
      BENCHMARK_MODE: ${{ inputs.benchmark_mode }}
      BENCHMARK_CONCURRENCY: ${{ inputs.concurrency }}
      BENCHMARK_TOTAL_OPERATIONS: ${{ inputs.total_operations }}
      BENCHMARK_OUTPUT_FILE: valkey-benchmark-results.json

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Validate benchmark configuration
      - name: Validate benchmark configuration
        run: |
          node --input-type=module <<'EOF'
          import { loadBenchmarkConfig } from "./benchmarks/valkey/config/benchmarkConfig.js";

          const config = loadBenchmarkConfig();

          console.log("Benchmark configuration verified");
          console.log("Key prefix:", config.keyPrefix);
          console.log("Expected Valkey version:", config.expectedValkeyVersion);
          EOF

      # Step 5: Validate Valkey service and safety
      - name: Validate Valkey benchmark environment
        run: |
          node --input-type=module <<'EOF'
          import { createClient } from "redis";
          import { loadBenchmarkConfig } from "./benchmarks/valkey/config/benchmarkConfig.js";
          import { validateBenchmarkEnvironment } from "./benchmarks/valkey/config/validateBenchmarkEnvironment.js";

          const config = loadBenchmarkConfig();

          const client = createClient({
            url: config.connectionUrl
          });

          client.on("error", error => {
            console.error(
              "Benchmark Valkey error:",
              error.message
            );
          });

          try {
            await client.connect();

            await validateBenchmarkEnvironment(client);

            console.log(
              "Valkey benchmark safety validation passed"
            );
          } finally {
            if (client.isOpen) {
              await client.quit();
            }
          }
          EOF

      # Step 6: Execute performance benchmark
      - name: Run Valkey performance benchmark
        run: |
          echo "Starting CricZone Valkey performance benchmark"
          echo "Mode: $BENCHMARK_MODE"
          echo "Concurrency: $BENCHMARK_CONCURRENCY"
          echo "Total operations: $BENCHMARK_TOTAL_OPERATIONS"

          node benchmarks/valkey/benchmark.js

      # Step 7: Upload benchmark report
      - name: Upload Valkey benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valkey-benchmark-${{ github.run_id }}
          path: server/valkey-benchmark-results.json
          if-no-files-found: warn
          retention-days: 14
