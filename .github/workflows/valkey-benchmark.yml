
name: Valkey Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_suite:
        description: "Select benchmark execution mode"
        required: true
        default: "all-workloads"
        type: choice
        options:
          - all-workloads
          - single

      benchmark_mode:
        description: "Workload for single mode"
        required: true
        default: "mixed"
        type: choice
        options:
          - mixed
          - read
          - write
          - commentary
          - invalidation
          - ttl
          - live_ball

      concurrency:
        description: "Concurrent workers"
        required: true
        default: "10"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "25"
          - "50"

      total_operations:
        description: "Operations per workload"
        required: true
        default: "300"
        type: string

jobs:
  prepare-matrix:
    name: Prepare Benchmark Matrix
    runs-on: ubuntu-latest

    outputs:
      modes: ${{ steps.configure.outputs.modes }}

    steps:
      - name: Configure workloads
        id: configure
        env:
          SUITE: ${{ inputs.benchmark_suite }}
          MODE: ${{ inputs.benchmark_mode }}
        run: |
          if [ "$SUITE" = "all-workloads" ]; then
            echo 'modes=["read","write","commentary","invalidation","ttl","live_ball"]' >> "$GITHUB_OUTPUT"
          else
            echo "modes=[\"$MODE\"]" >> "$GITHUB_OUTPUT"
          fi

  valkey-benchmark:
    name: Benchmark - ${{ matrix.mode }}
    needs: prepare-matrix

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.prepare-matrix.outputs.modes) }}

    services:
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      BENCHMARK_VALKEY_URL: redis://127.0.0.1:6379
      BENCHMARK_MODE: ${{ matrix.mode }}
      BENCHMARK_CONCURRENCY: ${{ inputs.concurrency }}
      BENCHMARK_TOTAL_OPERATIONS: ${{ inputs.total_operations }}
      BENCHMARK_OUTPUT_FILE: valkey-benchmark-results.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate benchmark configuration
        run: |
          node --input-type=module <<'EOF'
          import { loadBenchmarkConfig } from "./benchmarks/valkey/config/benchmarkConfig.js";

          const config = loadBenchmarkConfig();

          console.log("Benchmark configuration verified");
          console.log("Key prefix:", config.keyPrefix);
          console.log("Expected Valkey version:", config.expectedValkeyVersion);
          EOF

      - name: Validate Valkey benchmark environment
        run: |
          node --input-type=module <<'EOF'
          import { createClient } from "redis";
          import { loadBenchmarkConfig } from "./benchmarks/valkey/config/benchmarkConfig.js";
          import { validateBenchmarkEnvironment } from "./benchmarks/valkey/config/validateBenchmarkEnvironment.js";

          const config = loadBenchmarkConfig();

          const client = createClient({
            url: config.connectionUrl
          });

          client.on("error", error => {
            console.error("Benchmark Valkey error:", error.message);
          });

          try {
            await client.connect();
            await validateBenchmarkEnvironment(client);
            console.log("Valkey benchmark safety validation passed");
          } finally {
            if (client.isOpen) {
              await client.quit();
            }
          }
          EOF

      - name: Run Valkey performance benchmark
        run: |
          echo "Starting CricZone Valkey benchmark"
          echo "Mode: $BENCHMARK_MODE"
          echo "Concurrency: $BENCHMARK_CONCURRENCY"
          echo "Total operations: $BENCHMARK_TOTAL_OPERATIONS"

          node benchmarks/valkey/benchmark.js

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valkey-${{ matrix.mode }}-${{ github.run_id }}
          path: server/valkey-benchmark-results.json
          if-no-files-found: warn
          retention-days: 14
