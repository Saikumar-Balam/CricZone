name: Kafka Resilience Testing

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/kafka-resilience.yml"
      - "server/benchmarks/resilience/kafka/**"

permissions:
  contents: read

jobs:
  kafka-resilience:
    name: Isolated Kafka Outage and Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      KAFKA_RESILIENCE_BROKERS: 127.0.0.1:9092
      TEST_KAFKA_BROKERS: 127.0.0.1:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Kafka broker
        run: |
          set -euo pipefail
          docker run -d \
            --name criczone-kafka-resilience \
            -p 127.0.0.1:9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.9.1

      - name: Wait for Kafka readiness
        run: |
          set -euo pipefail
          for n in $(seq 1 60); do
            if docker exec criczone-kafka-resilience \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1; then
              echo "Kafka ready"
              exit 0
            fi
            sleep 2
          done
          docker logs criczone-kafka-resilience
          exit 1

      - name: Run broker outage and recovery benchmark
        run: node benchmarks/resilience/kafka/kafka-resilience.js

      - name: Validate resilience report
        if: success()
        run: |
          node --input-type=module <<'EOFJS'
          import fs from 'node:fs';

          const r = JSON.parse(
            fs.readFileSync(
              'benchmarks/resilience/kafka/reports/recovery.json',
              'utf8'
            )
          );

          for (const field of [
            'baselineDelivered',
            'outageDetected',
            'brokerRestarted',
            'originalConsumerRecovered',
            'producerRecovered',
            'postRecoveryDelivered',
            'allExpectedEventIdsObserved',
            'duplicateBusinessHandlersPreventedInMemory',
            'passed'
          ]) {
            if (r[field] !== true) {
              throw new Error(`Missing Kafka resilience proof: ${field}`);
            }
          }

          if (
            r.expectedEventCount !== 2 ||
            r.uniqueEventCount !== 2 ||
            r.failures?.length !== 0
          ) {
            throw new Error('Kafka reconciliation or benchmark failure');
          }

          console.log('PASS: isolated Kafka failure and recovery');
          EOFJS

      - name: Upload resilience report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-resilience-${{ github.run_id }}
          path: server/benchmarks/resilience/kafka/reports/recovery.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show Kafka logs on failure
        if: failure()
        run: docker logs criczone-kafka-resilience || true

      - name: Remove isolated Kafka container
        if: always()
        run: docker rm -f criczone-kafka-resilience || true