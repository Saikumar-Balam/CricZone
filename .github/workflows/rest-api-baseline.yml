
name: CricZone REST Baseline 25.8.1

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Baseline (rate-limit friendly) or stress (may trigger 429)"
        type: choice
        options:
          - baseline
          - stress
          - capacity
        required: true
        default: baseline

permissions:
  contents: read

concurrency:
  group: criczone-rest-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: criczone
          POSTGRES_PASSWORD: criczone_ci_password
          POSTGRES_DB: criczone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criczone -d criczone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'

    env:
      NODE_ENV: test
      PORT: '3000'

      # PostgreSQL
      DATABASE_URL: postgresql://criczone:criczone_ci_password@localhost:5432/criczone_test
      TEST_DATABASE_URL: postgresql://criczone:criczone_ci_password@localhost:5432/criczone_test

      # Redis
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379

      # Kafka
      KAFKA_CLIENT_ID: criczone-rest-baseline
      KAFKA_BROKERS: localhost:9092
      TEST_KAFKA_BROKERS: localhost:9092
      KAFKA_LIVE_CONSUMER_GROUP: criczone-rest-baseline-group
      TEST_KAFKA_TOPIC: criczone.test.live-events

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TEST_CORS_ALLOWED_ORIGINS: http://localhost:5173

      # Benchmark configuration
      BASE_URL: http://127.0.0.1:3000
      MATCH_ID: '1'
      ISOLATED_TEST_ENV: 'true'
      PROFILE: ${{ inputs.profile }}
      CRICZONE_CI_CAPACITY_TEST: ${{ inputs.profile == 'capacity' && 'true' || 'false' }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout and backend dependencies
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      # ------------------------------------------------------------
      # 2. Install k6
      # ------------------------------------------------------------

      - name: Install k6
        run: |
          set -euo pipefail

          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor \
                -o /usr/share/keyrings/k6-archive-keyring.gpg

          echo \
            'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' \
            | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install -y k6

          k6 version

      # ------------------------------------------------------------
      # 3. Initialize PostgreSQL with required migration
      # ------------------------------------------------------------

      - name: Initialize PostgreSQL schema, migrations and seed data
        working-directory: server
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: criczone
          PGPASSWORD: criczone_ci_password
          PGDATABASE: criczone_test
        run: |
          set -euo pipefail

          echo "Resetting isolated CI database schema"

          psql -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA IF EXISTS public CASCADE;'

          psql -v ON_ERROR_STOP=1 \
            -f database/schema/schema.sql

          echo "Applying cache invalidation outbox migration"

          psql -v ON_ERROR_STOP=1 \
            -f database/migrations/001_create_cache_invalidation_outbox.sql

          echo "Seeding cricket test data"

          psql -v ON_ERROR_STOP=1 \
            -f database/seeds/seed.sql

          echo "Verifying cache invalidation outbox table"

          psql -Atqc \
            "SELECT to_regclass('public.cache_invalidation_outbox') IS NOT NULL" \
            | grep -qx 't'

          echo "Verifying seeded match and scorecard"

          psql -Atqc \
            'SELECT match_id FROM scorecards WHERE match_id = 1' \
            | grep -qx '1'

          echo "Database initialization verified"

      # ------------------------------------------------------------
      # 4. Initialize Kafka
      # ------------------------------------------------------------

      - name: Initialize Kafka topics
        working-directory: server
        run: |
          set -euo pipefail

          node --input-type=module <<'EOFJS'
          import { Kafka } from 'kafkajs';

          const kafka = new Kafka({
            clientId: 'criczone-rest-benchmark-admin',
            brokers: ['localhost:9092'],
            connectionTimeout: 10000,
            retry: {
              retries: 10,
              initialRetryTime: 1000
            }
          });

          const admin = kafka.admin();

          try {
            await admin.connect();

            await admin.createTopics({
              waitForLeaders: true,
              topics: [
                {
                  topic: 'criczone.live.ball-events',
                  numPartitions: 1,
                  replicationFactor: 1
                },
                {
                  topic: 'criczone.test.live-events',
                  numPartitions: 1,
                  replicationFactor: 1
                }
              ]
            });

            console.log('Kafka topics initialized');
          } finally {
            await admin.disconnect();
          }
          EOFJS

      # ------------------------------------------------------------
      # 5. Start isolated Express backend
      # ------------------------------------------------------------

      - name: Start isolated Express server
        working-directory: server
        run: |
          set -euo pipefail

          nohup npm start \
            > /tmp/criczone-rest-baseline-server.log 2>&1 &

          echo $! > /tmp/criczone-rest-baseline-server.pid

          echo "CricZone backend process started"

      - name: Verify backend readiness
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do

            if curl \
              --fail \
              --silent \
              --output /dev/null \
              http://127.0.0.1:3000/health; then

              echo "CricZone backend is ready"
              exit 0
            fi

            if ! kill -0 \
              "$(cat /tmp/criczone-rest-baseline-server.pid)" \
              2>/dev/null; then

              echo "Backend process exited unexpectedly"
              tail -n 150 /tmp/criczone-rest-baseline-server.log
              exit 1
            fi

            sleep 2
          done

          echo "Backend readiness timed out"
          tail -n 150 /tmp/criczone-rest-baseline-server.log
          exit 1

      # ------------------------------------------------------------
      # 6. Validate API endpoints before benchmarking
      # ------------------------------------------------------------

      - name: Validate REST endpoints before load
        run: |
          set -euo pipefail

          for path in \
            /api/v1/matches \
            /api/v1/matches/1 \
            /api/v1/matches/1/scorecard
          do

            echo "Checking ${path}"

            response_file="$(mktemp)"

            status="$(
              curl \
                --silent \
                --show-error \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                "${BASE_URL}${path}"
            )"

            echo "HTTP status: ${status}"

            if [ "${status}" != "200" ]; then
              echo "::error::REST preflight failed for ${path}"
              echo "Response body:"
              head -c 3000 "${response_file}"
              echo ""

              rm -f "${response_file}"
              exit 1
            fi

            node -e '
              const fs = require("fs");
              const path = process.argv[1];

              let payload;

              try {
                payload = JSON.parse(
                  fs.readFileSync(path, "utf8")
                );
              } catch (error) {
                console.error(
                  "Invalid JSON response:",
                  error.message
                );
                process.exit(1);
              }

              if (
                payload.success !== true ||
                payload.data === undefined ||
                payload.data === null
              ) {
                console.error(
                  "Unexpected CricZone API response structure"
                );
                process.exit(1);
              }

              console.log("Valid cricket API payload");
            ' "${response_file}"

            rm -f "${response_file}"

          done

          echo "All cricket REST endpoints passed preflight"
     
      - name: Profile PostgreSQL queries 25.8.3
        if: ${{ inputs.profile == 'capacity' }}
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: criczone
          PGPASSWORD: criczone_ci_password
          PGDATABASE: criczone_test
        run: |
          set -euo pipefail

          mkdir -p benchmark-evidence

          psql -X -v ON_ERROR_STOP=1 \
            -f server/database/scripts/profile-rest-queries.sql \
            > benchmark-evidence/postgresql-query-profile.txt

          echo "PostgreSQL profiling completed"



      # ------------------------------------------------------------
      # 7. Existing health smoke benchmark
      # ------------------------------------------------------------

      - name: Run existing health smoke benchmark
        run: |
          set -euo pipefail

          k6 run server/load-tests/rest-api.js

      # ------------------------------------------------------------
      # 8. Representative cricket REST benchmark
      # ------------------------------------------------------------

      - name: Run cricket REST baseline
        run: |
          set -euo pipefail

          k6 run server/load-tests/rest-api-baseline.js

      
      - name: Run REST bottleneck and PostgreSQL connection analysis
        if: ${{ inputs.profile == 'capacity' }}
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: criczone
          PGPASSWORD: criczone_ci_password
          PGDATABASE: criczone_test
        run: |
          set -euo pipefail

          mkdir -p benchmark-evidence

          echo "timestamp_epoch,total,active,idle,waiting" \
            > benchmark-evidence/postgresql-connections.csv

          k6 run server/load-tests/rest-api-bottlenecks.js &
          benchmark_pid=$!

          while kill -0 "$benchmark_pid" 2>/dev/null; do
            psql -X -At -F ',' -c "
              SELECT
                EXTRACT(EPOCH FROM clock_timestamp()),
                COUNT(*),
                COUNT(*) FILTER (WHERE state = 'active'),
                COUNT(*) FILTER (WHERE state = 'idle'),
                COUNT(*) FILTER (
                  WHERE wait_event_type IS NOT NULL
                    AND state = 'active'
                )
              FROM pg_stat_activity
              WHERE datname = current_database()
                AND pid <> pg_backend_pid()
                AND backend_type = 'client backend'
                AND application_name IS DISTINCT FROM 'psql';
            " >> benchmark-evidence/postgresql-connections.csv

            sleep 1
          done

          wait "$benchmark_pid"


      # ------------------------------------------------------------
      # 9. Preserve benchmark evidence
      # ------------------------------------------------------------

      - name: Preserve backend log
        if: always()
        run: |
          mkdir -p benchmark-evidence

          if [ -f /tmp/criczone-rest-baseline-server.log ]; then
            cp \
              /tmp/criczone-rest-baseline-server.log \
              benchmark-evidence/server.log
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criczone-rest-baseline-${{ github.run_id }}
          path: |
            rest-api-baseline-results.json
            rest-api-bottlenecks-results.json
            benchmark-evidence/server.log
            benchmark-evidence/postgresql-query-profile.txt
            benchmark-evidence/postgresql-connections.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Show backend logs on failure
        if: failure()
        run: |
          if [ -f /tmp/criczone-rest-baseline-server.log ]; then
            echo "Last 150 lines of CricZone backend logs"
            tail -n 150 /tmp/criczone-rest-baseline-server.log
          fi
