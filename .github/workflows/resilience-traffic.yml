
name: Resilience Traffic During Valkey Failure

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/resilience-traffic.yml"
      - "server/benchmarks/resilience/traffic/**"

permissions:
  contents: read

jobs:
  valkey-http-traffic:
    name: Continuous HTTP Traffic and PostgreSQL Fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: criczone_test
          POSTGRES_PASSWORD: criczone_test_password
          POSTGRES_DB: criczone_resilience
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criczone_test -d criczone_resilience"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:56379
      TEST_REDIS_URL: redis://127.0.0.1:56379
      TEST_DATABASE_URL: postgresql://criczone_test:criczone_test_password@127.0.0.1:5432/criczone_resilience

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Valkey container
        run: |
          set -euo pipefail

          docker run -d \
            --name criczone-traffic-valkey \
            -p 127.0.0.1:56379:6379 \
            valkey/valkey:8-alpine

          for n in $(seq 1 40); do
            if docker exec criczone-traffic-valkey \
              valkey-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Apply isolated PostgreSQL outbox migration
        run: |
          node --input-type=module <<'EOFJS'
          import fs from 'node:fs';
          import pg from 'pg';

          const client = new pg.Client({
            connectionString: process.env.TEST_DATABASE_URL
          });

          try {
            await client.connect();

            await client.query(
              fs.readFileSync(
                'database/migrations/001_create_cache_invalidation_outbox.sql',
                'utf8'
              )
            );

            const result = await client.query(
              "SELECT to_regclass('public.cache_invalidation_outbox') AS relation"
            );

            if (!result.rows[0]?.relation) {
              throw new Error('Outbox migration missing');
            }
          } finally {
            await client.end();
          }
          EOFJS

      - name: Run continuous HTTP traffic through Valkey outage
        run: |
          node benchmarks/resilience/traffic/valkey-http-traffic.js

      - name: Validate HTTP resilience report
        run: |
          node --input-type=module <<'EOFJS'
          import fs from 'node:fs';

          const r = JSON.parse(
            fs.readFileSync(
              'benchmarks/resilience/traffic/reports/valkey-http.json',
              'utf8'
            )
          );

          for (const key of [
            'isolated',
            'outageConfirmed',
            'invalidationCommitted',
            'postgresFallbackUsed',
            'workerRepairedCache',
            'sameRedisClientRecovered',
            'passed'
          ]) {
            if (r[key] !== true) {
              throw new Error(`Missing evidence: ${key}`);
            }
          }

          for (const phase of [
            'baseline',
            'outage',
            'recovery'
          ]) {
            if (
              r.traffic?.[phase]?.requests < 10 ||
              r.traffic[phase].failures !== 0
            ) {
              throw new Error(
                `HTTP traffic failed: ${phase}`
              );
            }
          }

          if (r.failures.length !== 0) {
            throw new Error('Benchmark reported failures');
          }

          console.log(
            'PASS: HTTP traffic survived Valkey outage'
          );
          EOFJS

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-traffic-${{ github.run_id }}
          path: server/benchmarks/resilience/traffic/reports/valkey-http.json
          if-no-files-found: warn
          retention-days: 14

      - name: Valkey logs on failure
        if: failure()
        run: docker logs criczone-traffic-valkey || true

      - name: Remove isolated Valkey
        if: always()
        run: docker rm -f criczone-traffic-valkey || true
